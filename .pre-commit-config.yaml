repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-personal-paths
        name: no personal file paths
        entry: /Users/[A-Za-z0-9._-]+/
        language: pygrep
        # Generated by an XMOS tool that records the command it was run with
        exclude: ^satellite-xmos-firmware/src/register_setup_.*\.h$
