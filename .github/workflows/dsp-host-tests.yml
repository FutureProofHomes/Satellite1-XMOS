name: DSP Host Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'modules/voice/**'
      - 'tests/test_dsp_host/**'
      - 'tools/build_dsp_host.sh'
      - 'tools/setup_dsp_host.sh'
      - 'requirements_tests_dsp.txt'
      - '.github/workflows/dsp-host-tests.yml'
  pull_request:
    paths:
      - 'modules/voice/**'
      - 'tests/test_dsp_host/**'
      - 'tools/build_dsp_host.sh'
      - 'tools/setup_dsp_host.sh'
      - 'requirements_tests_dsp.txt'
      - '.github/workflows/dsp-host-tests.yml'
  workflow_dispatch:

jobs:
  dsp-host-tests:
    name: Build & run DSP pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_tests_dsp.txt

      - name: Build DSP pipeline binary
        run: |
          bash tools/build_dsp_host.sh

      - name: Run Layer 1 gates
        run: |
          pytest tests/test_dsp_host/test_dsp_gates.py -v \
            --dsp-binary build-host/examples/bare-metal/pipeline_single_threaded/bin/fwk_voice_example_bare_metal_pipeline_single_thread

      - name: Run Layer 2 regression
        run: |
          pytest tests/test_dsp_host/test_dsp_regression.py -v \
            --dsp-binary build-host/examples/bare-metal/pipeline_single_threaded/bin/fwk_voice_example_bare_metal_pipeline_single_thread

      - name: Run Layer 3 informational
        if: always()
        run: |
          pytest tests/test_dsp_host/test_dsp_informational.py -v \
            --dsp-binary build-host/examples/bare-metal/pipeline_single_threaded/bin/fwk_voice_example_bare_metal_pipeline_single_thread
