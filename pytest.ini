[pytest]
addopts = -p no:pytest_asyncio --ignore=modules/inferencing/lib_tflite_micro/lib_tflite_micro/submodules/ruy/third_party/googletest/googlemock/test/gmock-function-mocker_nc_test.py
asyncio_default_fixture_loop_scope = function
markers =
    hil: hardware-in-the-loop tests that require connected devices
    sat1: tests specific to Satellite1 board bring-up and integration
    sq66: tests specific to XK-VOICE-SQ66 board bring-up and integration
    doa_cunit: bridge test that runs modules/fph/doa C unit tests via ctest
    requires_bypass_firmware: tests that require bypass firmware variant
    requires_mic_pattern_firmware: tests that require mic-pattern test firmware
    requires_speaker_pattern_firmware: tests that require speaker-output pattern firmware
